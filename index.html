<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Taehyung Photo Booth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="flash-overlay"></div>
  <video id="camera-video" autoplay playsinline muted style="display:none;"></video>

  <header class="booth-header">
    <span class="kiosk-tag">PHOTOISM × V LIVE EDITION</span>
    <h1>Taehyung Photo Booth</h1>
  </header>

  <main class="booth-workspace">
    <!-- LEFT: LIVE PHOTOBOOTH STRIP -->
    <section class="preview-column">
      <div class="strip-stage">
        <canvas id="booth-canvas" width="720" height="2160"></canvas>
        <div id="countdown-overlay" class="countdown-badge hidden">3</div>
      </div>
      <p class="touch-hint" id="status-hint">Removing photo backgrounds cleanly...</p>
    </section>

    <!-- RIGHT: CONTROLS -->
    <section class="controls-column">
      <!-- CAMERA CAPTURE BAR -->
      <div class="control-card capture-card">
        <div class="card-title-row">
          <h2>📸 Live Booth Camera</h2>
          <span class="active-label" id="cam-status-label">Ready</span>
        </div>
        <div class="capture-btn-row">
          <button id="btn-start-booth" class="btn-capture" type="button">📸 Start 4-Cut Camera</button>
          <button id="btn-timer" class="chip-btn" type="button">⏱️ 3s</button>
          <button id="btn-clear-shots" class="chip-btn" type="button">Clear Photos</button>
        </div>
      </div>

      <!-- 1. PHOTOISM & LIFE4CUTS BORDERS + COLOR PALETTE -->
      <div class="control-card">
        <div class="card-title-row">
          <h2>1. Photoism &amp; Life4Cuts Borders</h2>
          <span class="active-label" id="active-frame-name">Classic Photoism</span>
        </div>
        <div class="horizontal-scroll" id="frame-selector">
          <button class="frame-pill active" data-frame="photoism" type="button">
            <span class="swatch-dot" style="background:#141414"></span>Classic Photoism
          </button>
          <button class="frame-pill" data-frame="red" type="button">
            <span class="swatch-dot" style="background:#991b1b"></span>Red Velvet V ❤️
          </button>
          <button class="frame-pill" data-frame="life4cuts" type="button">
            <span class="swatch-dot" style="background:#ffffff; border:1.5px solid #141414"></span>Life4Cuts White
          </button>
          <button class="frame-pill" data-frame="lavender" type="button">
            <span class="swatch-dot" style="background:#dcd0ff"></span>Borahe Lavender 💜
          </button>
          <button class="frame-pill" data-frame="coquette" type="button">
            <span class="swatch-dot" style="background:#ffdbe6"></span>Pink Coquette 🎀
          </button>
          <button class="frame-pill" data-frame="bear" type="button">
            <span class="swatch-dot" style="background:#f5e6d3"></span>Winter Bear V 🧸
          </button>
          <button class="frame-pill" data-frame="y2k" type="button">
            <span class="swatch-dot" style="background:#d4d8df"></span>Y2K Silver Star ✦
          </button>
          <button class="frame-pill" data-frame="cute" type="button">
            <span class="swatch-dot" style="background:#f8efe4"></span>Cream V Day
          </button>
          <button class="frame-pill" data-frame="bw" type="button">
            <span class="swatch-dot" style="background:#09090b"></span>Black &amp; White
          </button>
        </div>

        <!-- SHADE COLOR PALETTE PICKER -->
        <div class="palette-section">
          <div class="palette-header">
            <span>Custom Border Shade</span>
            <span class="active-label" id="custom-hex-label">Preset</span>
          </div>
          <div class="palette-row" id="shade-palette">
            <button type="button" class="shade-circle" data-color="#991b1b" style="background:#991b1b" title="Crimson Red"></button>
            <button type="button" class="shade-circle" data-color="#dc2626" style="background:#dc2626" title="Cherry Red"></button>
            <button type="button" class="shade-circle" data-color="#fecdd3" style="background:#fecdd3" title="Rose Blush"></button>
            <button type="button" class="shade-circle" data-color="#f9a8d4" style="background:#f9a8d4" title="Sakura Pink"></button>
            <button type="button" class="shade-circle" data-color="#ddd6fe" style="background:#ddd6fe" title="Borahe Lilac"></button>
            <button type="button" class="shade-circle" data-color="#6d28d9" style="background:#6d28d9" title="Royal Purple"></button>
            <button type="button" class="shade-circle" data-color="#bfdbfe" style="background:#bfdbfe" title="Baby Sky Blue"></button>
            <button type="button" class="shade-circle" data-color="#1e3a8a" style="background:#1e3a8a" title="Midnight Navy"></button>
            <button type="button" class="shade-circle" data-color="#bbf7d0" style="background:#bbf7d0" title="Mint Matcha"></button>
            <button type="button" class="shade-circle" data-color="#fef08a" style="background:#fef08a" title="Butter Yellow"></button>
            <button type="button" class="shade-circle" data-color="#e7d7c1" style="background:#e7d7c1" title="Latte Beige"></button>
            <button type="button" class="shade-circle" data-color="#18181b" style="background:#18181b" title="Obsidian Black"></button>

            <label class="color-wheel-btn" title="Pick any custom shade">
              <span>🎨</span>
              <input type="color" id="custom-color-input" value="#991b1b" />
            </label>
          </div>
        </div>
      </div>

      <!-- 2. TAEHYUNG POSE, FACING DIRECTION & POSITION -->
      <div class="control-card">
        <div class="card-title-row">
          <h2>2. Taehyung Pose &amp; Facing (<span id="selected-slot-badge">Slot 1</span>)</h2>
          <div class="slot-switcher" id="slot-switcher">
            <button class="slot-btn active" data-slot="0" type="button">1</button>
            <button class="slot-btn" data-slot="1" type="button">2</button>
            <button class="slot-btn" data-slot="2" type="button">3</button>
            <button class="slot-btn" data-slot="3" type="button">4</button>
          </div>
        </div>

        <div class="horizontal-scroll photo-strip-picker" id="photo-picker"></div>

        <div class="facing-row">
          <button id="btn-v-side" class="chip-btn" type="button">⇄ V Position: Right</button>
          <button id="btn-v-flip" class="chip-btn" type="button">🔄 Facing: Normal</button>
          <button id="btn-cam-mirror" class="chip-btn active" type="button">🪞 Cam Mirror: ON</button>
        </div>

        <div class="slider-grid">
          <label class="slider-item">
            <span>V Size</span>
            <input type="range" id="photo-zoom" min="0.6" max="1.5" step="0.02" value="0.96" />
          </label>
          <label class="slider-item">
            <span>Move X</span>
            <input type="range" id="photo-x" min="-180" max="180" step="2" value="0" />
          </label>
          <label class="slider-item">
            <span>Move Y</span>
            <input type="range" id="photo-y" min="-100" max="120" step="2" value="0" />
          </label>
        </div>
      </div>

      <!-- 3. FILTER & BRIGHTNESS -->
      <div class="control-card">
        <div class="card-title-row">
          <h2>3. Filter &amp; Brightness</h2>
          <span class="active-label" id="brightness-val">100%</span>
        </div>
        <div class="horizontal-scroll" id="filter-selector">
          <button class="chip-btn active" data-filter="original" type="button">Original</button>
          <button class="chip-btn" data-filter="bw" type="button">Black &amp; White</button>
          <button class="chip-btn" data-filter="warm" type="button">Warm</button>
          <button class="chip-btn" data-filter="vintage" type="button">Vintage</button>
          <button class="chip-btn" data-filter="soft" type="button">Soft</button>
        </div>
        <div class="single-slider">
          <label class="slider-item">
            <span>Brightness</span>
            <input type="range" id="photo-brightness" min="75" max="135" step="1" value="100" />
          </label>
        </div>
      </div>

      <!-- 4. PARTY-HAT HEAD STICKERS -->
      <div class="control-card">
        <div class="card-title-row">
          <h2>4. Party-Hat Head Stickers</h2>
          <button class="text-action" id="btn-reset-stickers" type="button">Reset Positions</button>
        </div>
        <div class="sticker-toggle-row" id="sticker-toggles"></div>
        <div class="slider-grid">
          <label class="slider-item">
            <span>Sticker Size</span>
            <input type="range" id="sticker-scale" min="0.45" max="1.75" step="0.02" value="1.0" />
          </label>
          <label class="slider-item">
            <span>Rotate</span>
            <input type="range" id="sticker-rotate" min="-45" max="45" step="1" value="-10" />
          </label>
          <label class="slider-item">
            <span>Active Sticker</span>
            <select id="active-sticker-select">
              <option value="0">Hat Sticker 1</option>
              <option value="1">Hat Sticker 2</option>
            </select>
          </label>
        </div>
      </div>

      <!-- DOWNLOAD -->
      <div class="action-footer">
        <button id="btn-download" class="btn-download" type="button">
          Download Photo Strip (PNG)
        </button>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
